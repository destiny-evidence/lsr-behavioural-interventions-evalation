[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs",
  "hatchling",
]

[project]
name = "living-review-interventions"
description = """\
  Evaluating the use of AI to automate a living systematic review on behavioural interventions targeting household \
  energy use\
  """
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [
  "version",
]
dependencies = [
  "dspy>=3.4.1",
  "dvc[azure,ssh]>=3.67.1",
  "openpyxl>=3.1.5",
  "pandas>=3.0.6",
]

[tool.hatch]
version.source = "vcs"
build.targets.wheel.packages = [
  "src/living_review_interventions",
]

[tool.ruff]
lint.select = [
  "B",
  "E",
  "F",
  "I",
  "UP",
  "W",
]

[tool.ty]
environment.python-version = "3.13"
